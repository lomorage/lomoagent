# LomoAgent on a Linux machine -- see README.md next to this file.
#
#   docker compose up -d
#   docker compose logs      # the web address; the first visit there sets the admin password
services:
  lomo:
    image: ghcr.io/lomorage/lomo-photo-viewer:latest
    container_name: lomo-photo-viewer
    restart: unless-stopped
    # Host networking: phones and computers on the LAN reach it at this machine's IP, the
    # Lomorage mobile app can discover it on the LAN, and the addresses/QR codes the web app
    # shows are the machine's real IP. Ports used: 3001 (web), 8000 (lomod), 8004 (WebDAV).
    network_mode: host
    environment:
      # First account. With the password empty, the first visit to the web app asks for it;
      # set it here instead to create the account on the first start (unattended installs).
      LOMO_ADMIN_USER: admin
      LOMO_ADMIN_PASSWORD: ""
      # Time zone used to date photos; change to yours.
      TZ: Asia/Shanghai
    volumes:
      - ./lomo/photos:/photos   # your photos (originals + previews)
      - ./lomo/data:/data       # database, logs, settings

# Builds the Windows installer (NSIS setup.exe) from source: the Immich web frontend
# (submodules/immich), the proxy (proxy/), lomod (submodules/lomod) and the Tauri shell.
#
# The MSI isn't built here: WiX's light.exe fails on the hosted runner, and releases only
# ship the NSIS installer anyway (install.ps1 and publish-release-assets.ps1 use *setup.exe).
#
# Every run uploads the installer as a workflow artifact, then installs it on the runner,
# starts the app and runs scripts/ci/smoke-test.mjs against it (web UI loads, create the
# admin account, sign in, upload a photo, timeline + thumbnail + full-size preview).
#
# It runs only when a release/** branch is created or pushed to, and when started by hand
# (Actions -> Build Windows installer -> Run workflow); not on main, other branches or PRs.
# A manual run with release_tag set also publishes a GitHub Release, tagging the commit it
# built: vX.Y.Z (matching "version" in src-tauri/tauri.conf.json) makes a *draft* with the
# installer and install.ps1 attached, to publish by hand once checked, since install.ps1
# installs whatever the latest published release is; vX.Y.Z-<suffix> (e.g. v1.0.21-test.1)
# publishes a pre-release, which install.ps1 never picks.
name: Build Windows installer

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish a release with this tag, e.g. v1.0.21-test.1 (pre-release) or v1.0.21 (draft); X.Y.Z must match tauri.conf.json. Empty: build and test only."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tag }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write # for the release on tags / release_tag
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Allow long paths (node_modules, exiftool_files)
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - name: Check out the immich and lomod submodules
        # Not the test-data submodules: they're large and not needed to build.
        run: git submodule update --init --depth 1 submodules/immich submodules/lomod

      - name: Read app version
        id: version
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          # The release tag: the pushed v* tag, or release_tag on a manual run; none otherwise.
          $tag = "$env:RELEASE_TAG".Trim()
          if (-not $tag -and $env:GITHUB_REF -like 'refs/tags/v*') { $tag = $env:GITHUB_REF_NAME }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # vX.Y.Z -> draft release; vX.Y.Z-<anything> (e.g. v1.0.21-test.1) -> published pre-release
          $prerelease = $tag -like "v$version-*"
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($tag -and $tag -ne "v$version" -and -not $prerelease) {
            throw "Release tag $tag doesn't match tauri.conf.json version $version (use v$version or v$version-<suffix>)"
          }
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      # ---- toolchains ----
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1 # submodules/immich/web requires it (engine-strict)

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3 # the version submodules/immich pins

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26" # same as lomod's CI
          cache: false # lomod vendors its dependencies

      - name: Set up MSYS2 UCRT64 (mingw-w64 toolchain for lomod's cgo + libvips)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-tools-git

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true # keep the compiled tauri-cli even when a later step fails

      - name: Install tauri-cli
        run: |
          cargo tauri --version *> $null
          if ($LASTEXITCODE -ne 0) { cargo install tauri-cli --version "^2" --locked }

      # ---- lomod ----
      - name: Cache lomod's Windows dependencies (vips-dev, exiftool)
        uses: actions/cache@v4
        with:
          path: submodules/lomod/windows-deps
          key: lomod-windows-deps-${{ hashFiles('submodules/lomod/scripts/windows/fetch-vips.ps1', 'submodules/lomod/scripts/windows/collect-deps.ps1') }}

      - name: Build lomod
        run: |
          # Only for this step, so the MinGW tools don't shadow anything the Rust/Node builds use.
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          ./scripts/build-lomod-windows.ps1

      # ---- web + proxy + Tauri ----
      - name: Build installers
        # Normally ~20 min; fail a hung build instead of waiting for the job's 120.
        timeout-minutes: 45
        run: ./build-tauri.ps1 -Bundles nsis

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: lomoagent-windows-${{ steps.version.outputs.version }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # ---- smoke test: install the package and drive the basic user flow ----
      - name: Install the package and start the app
        id: app
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Write-Host "Installing $($setup.Name) silently"
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "installer exited with code $($installer.ExitCode)" }

          # The app installs per-user by default; find it by its bundled proxy.exe
          $proxyExe = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Filter proxy.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $proxyExe) { throw "installed app not found (no proxy.exe under LOCALAPPDATA or Program Files)" }
          $installDir = $proxyExe.DirectoryName
          if (-not (Test-Path "$installDir\lomod\lomod.exe")) { throw "lomod\lomod.exe missing from $installDir" }
          # lomod shells out to these; exiftool also needs its exiftool_files\ tree intact next to it
          & "$installDir\lomod\exiftool.exe" -ver
          if ($LASTEXITCODE -ne 0) { throw "bundled exiftool.exe does not run" }
          & "$installDir\lomod\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "bundled ffmpeg.exe does not run" }
          $appExe = Get-ChildItem $installDir -Filter *.exe |
            Where-Object { $_.Name -notin @("proxy.exe", "uninstall.exe") } | Select-Object -First 1
          if (-not $appExe) { throw "app executable not found in $installDir" }
          Write-Host "Installed to $installDir"
          Get-ChildItem $installDir | Format-Table Name, Length -AutoSize | Out-String | Write-Host

          Write-Host "Starting $($appExe.Name)"
          $app = Start-Process -FilePath $appExe.FullName -PassThru
          "pid=$($app.Id)" >> $env:GITHUB_OUTPUT

      - name: Smoke test
        run: |
          # First run: the app's data dir is fresh, so its photos dir is the default
          # <data dir>\photos, and setup puts the admin's home under it.
          $env:ADMIN_HOME = "$env:APPDATA\com.lomoware.photoviewer\photos\admin"
          node scripts/ci/smoke-test.mjs
          if ($LASTEXITCODE -ne 0) { throw "smoke test failed" }
          if (-not (Get-Process -Id ${{ steps.app.outputs.pid }} -ErrorAction SilentlyContinue)) {
            throw "the app exited during the smoke test"
          }

      - name: App logs
        if: always() && steps.app.outcome != 'skipped'
        run: |
          $dataDir = "$env:APPDATA\com.lomoware.photoviewer"
          Get-ChildItem $dataDir -Recurse -Include *.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.FullName)"
            Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
          }
          Get-Process lomod, proxy -ErrorAction SilentlyContinue | Format-Table Id, Name, StartTime -AutoSize | Out-String | Write-Host
          if ("${{ steps.app.outputs.pid }}") { Stop-Process -Id ${{ steps.app.outputs.pid }} -Force -ErrorAction SilentlyContinue }
          Stop-Process -Name lomod, proxy -Force -ErrorAction SilentlyContinue

      - name: GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # A test tag publishes a pre-release right away: install.ps1 installs the latest
          # release, which never is a pre-release, so users aren't moved onto it.
          draft: ${{ steps.version.outputs.prerelease != 'true' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            install.ps1

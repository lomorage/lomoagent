# Builds the Linux Docker image (docker/Dockerfile: lomod + exiftool + ffmpeg + the web app and
# proxy), runs scripts/ci/docker-smoke.sh against it, and only then pushes it to
# ghcr.io/<owner>/lomo-photo-viewer.
#
# It runs only when a release/** branch is created or pushed to, and when started by hand
# (Actions -> Docker image -> Run workflow); not on main, other branches or PRs.
#
# Image tags pushed:
#   any run              -> <branch> (release/1.0 -> release-1.0) and sha-<commit>
#   release_tag docker-vX.Y.Z    -> also X.Y.Z and latest, plus a GitHub Release
#   release_tag docker-vX.Y.Z-*  -> also X.Y.Z-* and test, plus a GitHub pre-release
# (release_tag is a manual-run input; the release tags the commit it built.)
name: Docker image

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish a release with this tag, e.g. docker-v0.1.0-test.1 (pre-release, image :test) or docker-v0.1.0 (release, image :latest). Empty: build, test and push the branch image only."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release_tag }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lomo-photo-viewer

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # GitHub Release on docker-v* tags
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Check out the immich and lomod submodules
        run: git submodule update --init --depth 1 submodules/immich submodules/lomod

      - name: Versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Same format as lomod's own release builds: <build time>.0.<lomod commit>
          echo "lomod=$(date -u +%Y-%m-%d.%H-%M-%S).0.$(git -C submodules/lomod rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          # The release tag: the pushed docker-v* tag, or release_tag on a manual run; none otherwise.
          tag="$(echo "$RELEASE_TAG" | xargs)"
          [[ -z "$tag" && "$GITHUB_REF" == refs/tags/docker-v* ]] && tag="$GITHUB_REF_NAME"
          if [[ -n "$tag" && ! "$tag" =~ ^docker-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$tag' is not docker-vX.Y.Z or docker-vX.Y.Z-<suffix>"; exit 1
          fi
          prerelease=false
          [[ "$tag" == docker-v*-* ]] && prerelease=true
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_version=${tag#docker-v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.image_version }},priority=900,enable=${{ steps.version.outputs.tag != '' }}
            type=raw,value=test,enable=${{ steps.version.outputs.tag != '' && steps.version.outputs.prerelease == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.tag != '' && steps.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=LomoAgent
            org.opencontainers.image.description=lomod photo storage with the Immich-based web app, for Linux servers

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: LOMOD_VERSION=${{ steps.version.outputs.lomod }}
          load: true
          tags: lomo-photo-viewer:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1

      - name: Smoke test the image
        run: scripts/ci/docker-smoke.sh lomo-photo-viewer:ci

      - name: Test the one-command installer
        # As users run it (piped into bash), against the image just built: install, choose the
        # password on the first visit, sign in; run it again (how users upgrade) and sign in again.
        run: |
          login() {
            curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"email\":\"admin\",\"password\":\"$1\"}" "http://127.0.0.1:${2:-3001}/api/auth/login"
          }
          export LOMO_DIR="$RUNNER_TEMP/lomo"
          out=$(LOMO_IMAGE=lomo-photo-viewer:ci bash < docker/install.sh 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -q 'Web app (computer or phone browser):  http://' <<<"$out" || { echo "no web address printed"; exit 1; }
          grep -q 'the first visit asks you to choose it' <<<"$out" || { echo "no first-visit hint printed"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"password":"installer-test-pw"}' http://127.0.0.1:3001/api/lomo/setup)
          [ "$code" = 201 ] || { echo "first-visit setup returned $code"; exit 1; }
          [ "$(login installer-test-pw)" = 201 ] || { echo "login with the chosen password failed"; exit 1; }
          bash < docker/install.sh
          [ "$(login installer-test-pw)" = 201 ] || { echo "login failed after re-running the installer"; exit 1; }
          grep -q '^LOMO_IMAGE=lomo-photo-viewer:ci$' "$LOMO_DIR/.env" || { echo "re-run did not keep the settings"; exit 1; }
          (cd "$LOMO_DIR" && docker compose down)

          # Port 8000 already taken (e.g. a native lomod): the installer moves lomod to a free port,
          # and the web app still signs in (the proxy is pinned to the bundled lomod). Password
          # given up front this time, the unattended way.
          python3 -m http.server 8000 >/dev/null 2>&1 &
          blocker=$!
          export LOMO_DIR="$RUNNER_TEMP/lomo-ports"
          out=$(LOMO_IMAGE=lomo-photo-viewer:ci LOMO_ADMIN_PASSWORD=preset-pw bash < docker/install.sh 2>&1) || { echo "$out"; kill $blocker; exit 1; }
          echo "$out"
          grep -q 'port 8000 is already used' <<<"$out" || { echo "no port-conflict warning"; exit 1; }
          grep -q '^LOMO_LOMOD_PORT=8001$' "$LOMO_DIR/.env" || { echo "lomod was not moved to 8001"; exit 1; }
          [ "$(login preset-pw)" = 201 ] || { echo "login failed with lomod on 8001"; exit 1; }
          (cd "$LOMO_DIR" && docker compose down)
          kill $blocker

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: LOMOD_VERSION=${{ steps.version.outputs.lomod }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          # The repo's "latest" release stays the Windows one: install.ps1 and the README's
          # install command download from releases/latest.
          make_latest: false
          files: |
            docker/install.sh
            docker/docker-compose.yml
            docker/README.md
          body: |
            Docker image for Linux (linux/amd64): lomod (lomorage/lomod@${{ steps.version.outputs.lomod }}) with exiftool and ffmpeg, plus the web app.

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

            One-command install on a Linux machine (installs Docker if needed, then prints the web address; the first visit there sets the password of the `admin` account):

            ```
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/install.sh | LOMO_IMAGE=${{ env.IMAGE }}:${{ steps.meta.outputs.version }} bash
            ```

            Or download `docker-compose.yml` from this release and run `docker compose up -d`. Full instructions (Chinese): `README.md` below.
